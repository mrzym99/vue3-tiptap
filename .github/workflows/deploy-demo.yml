name: Deploy demo (examples/host)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace + build library (dist/ — the host app consumes it)
        run: pnpm install --frozen-lockfile && pnpm build:lib

      # Gate the public demo on tests + types; a broken master must not deploy
      - name: Typecheck + test
        run: pnpm exec vue-tsc -p tsconfig.lib.json && pnpm test

      - name: Build host demo
        run: pnpm --filter host-demo exec vite build --base=/vue3-tiptap/
        # Vite inlines VITE_* vars at build time — the deployed demo gets the
        # AI config from repository secrets (Settings → Secrets and variables → Actions).
        env:
          VITE_AI_BASE_URL: ${{ secrets.VITE_AI_BASE_URL }}
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          VITE_AI_MODEL: ${{ secrets.VITE_AI_MODEL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/host/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
