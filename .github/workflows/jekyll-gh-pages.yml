# Deploys examples/host (the published-style demo page) to GitHub Pages.
# pnpm workspace: root package + examples/host share one lockfile; the host
# links @yumine/vue3-tiptap directly to the repo root and consumes dist/,
# so it doubles as a smoke test that the package actually builds.
name: Deploy demo (examples/host)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace + build library (dist/ — the host app consumes it)
        run: pnpm install --frozen-lockfile && pnpm build:lib

      - name: Build host demo
        # Workspace root install already covers examples/host
        run: pnpm --filter host-demo exec vite build --base=/vue3-tiptap/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/host/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
